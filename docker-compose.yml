services:
  # The NestJS Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliveryways-api
    ports:
      - "5225:5225"
    environment:
      - NODE_ENV=development
      - PORT=5225
      - DATABASE_URL=postgresql://user:password@db:5432/deliveryways?schema=public
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # The Database (Local Dev Only)
  db:
    image: postgres:alpine
    container_name: deliveryways-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deliveryways
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d deliveryways"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: